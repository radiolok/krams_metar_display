name: PlatformIO CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        env: [esp32cam]
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
        restore-keys: ${{ runner.os }}-pio-

    - name: Install PlatformIO
      run: pip install platformio

    - name: Build firmware
      run: |
        set -o pipefail
        pio run -e ${{ matrix.env }} 2>&1 | tee build.log

    - name: Build filesystem image
      run: |
        set -o pipefail
        pio run -e ${{ matrix.env }} -t buildfs 2>&1 | tee -a build.log

    - name: Report errors as annotations
      if: failure()
      run: |
        grep -E "error:|Error:|Error [0-9]|FAILED|fatal|Traceback|No such file" build.log \
          | head -40 | sed 's/^/::error::/' || true

    - name: Upload firmware
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ matrix.env }}-${{ github.sha }}
        path: |
          .pio/build/${{ matrix.env }}/firmware.bin
          .pio/build/${{ matrix.env }}/spiffs.bin
          .pio/build/${{ matrix.env }}/littlefs.bin
        if-no-files-found: warn
        retention-days: 30

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ matrix.env }}-${{ github.run_id }}
        path: build.log
        retention-days: 7
